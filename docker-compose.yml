version: '3'
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - 5432:5432
    volumes:
      - postgres_db:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
volumes:
  postgres_db:
    driver: local